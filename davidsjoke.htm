<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Pages JS Demo</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f4f4f9;
    }
    .card {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      text-align: center;
    }
    button {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    #output {
      margin-top: 1.5rem;
      font-size: 1.25rem;
      font-weight: bold;
      color: #16a34a;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>David's Joke Time</h1>
    <p>What did the cupcake say to the frosting?</p>
    <button id="demoBtn">I don't know, what?</button>
    <div id="output"></div>
  </div>

  <!-- Link your external JavaScript file -->
  <script src="script.js"></script>
</body>
</html>
